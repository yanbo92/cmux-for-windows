name: Windows

on:
  push:
    branches: [main, windows-native-gui]
  pull_request:
  workflow_dispatch:

concurrency:
  group: windows-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: x86_64-pc-windows-gnu
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Match the upstream cmux-tui bundled in the Mac client used for the
      # VDI loop, so its SSH bootstrap accepts this Windows remote daemon.
      CMUX_TUI_BUILD_COMMIT: a9b104f3cb7d3808cf7eb5ae08b4819333b25870
      CMUX_TUI_DISTRIBUTION_VERSION: 0.0.0-r2.sha-a9b104f3cb7d3808cf7eb5ae08b4819333b25870

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Initialize Ghostty
        shell: bash
        run: git submodule update --init --depth 1 ghostty

      - name: Resolve Ghostty Zig version
        id: zig-version
        shell: bash
        run: echo "version=$(bash ./scripts/ghostty-zig-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Install Zig
        uses: mlugg/setup-zig@8d6198c65fb0feaa111df26e6b467fea8345e46f # v2.0.5
        with:
          version: ${{ steps.zig-version.outputs.version }}

      - name: Configure Rust GNU target
        shell: bash
        run: |
          rustup target add x86_64-pc-windows-gnu
          printf '%s\n' 'C:\msys64\mingw64\bin' >> "$GITHUB_PATH"

      - name: Cache Rust and Ghostty build data
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            cmux-tui\target
            ghostty\zig-cache
          key: windows-gnu-${{ hashFiles('cmux-tui/Cargo.lock', 'ghostty/build.zig.zon') }}
          restore-keys: |
            windows-gnu-

      - name: Check Rust formatting
        run: cargo fmt --manifest-path cmux-tui/Cargo.toml --all -- --check

      - name: Build Windows engine and TUI
        run: cargo build --manifest-path cmux-tui/Cargo.toml -p cmux-tui -p cmux-ffi --target x86_64-pc-windows-gnu --locked

      - name: Stage Windows iteration binaries
        shell: pwsh
        run: |
          $stage = Join-Path $env:RUNNER_TEMP 'cmux-windows-iteration'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item `
            'cmux-tui\target\x86_64-pc-windows-gnu\debug\cmux-tui.exe' `
            (Join-Path $stage 'cmux-tui.exe')
          Copy-Item `
            'cmux-tui\target\x86_64-pc-windows-gnu\debug\cmux_ffi.dll' `
            (Join-Path $stage 'cmux_ffi.dll')
          Copy-Item 'cmux-tui\Cargo.lock' (Join-Path $stage 'Cargo.lock')

      - name: Upload Windows iteration binaries
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cmux-windows-iteration-${{ github.sha }}
          path: ${{ runner.temp }}/cmux-windows-iteration
          if-no-files-found: error
          retention-days: 7

      - name: Test SSH stdio mux bridge
        run: cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-tui --test remote_link --target x86_64-pc-windows-gnu --locked

      - name: Test SSH default shell compatibility
        run: cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-tui-core --lib --target x86_64-pc-windows-gnu --locked platform::tests::ssh_default_shell_bootstrap_uses_native_shell_and_preserves_other_argv

      - name: Test terminal key encoding
        run: cargo test --manifest-path cmux-tui/Cargo.toml -p ghostty-vt --lib --target x86_64-pc-windows-gnu --locked key::tests::chord_parser_encodes_common_keys

      - name: Test Windows workspace persistence
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-tui-core --lib --target x86_64-pc-windows-gnu --locked workspace_registry::tests:: 2>&1 | tee workspace-tests.log
          grep -qE 'test result: ok\. [1-9][0-9]* passed' workspace-tests.log

      - name: Test GUI restart restoration
        shell: bash
        run: |
          set -o pipefail
          cargo test --manifest-path cmux-tui/Cargo.toml -p cmux-tui-core --lib --target x86_64-pc-windows-gnu --locked -- persistent_gui_restart_restores_terminal_cwds_and_agent_sessions resource_routing_revives_persisted_terminals_after_owner_restart terminal_attach_resolution_revives_persisted_terminal_after_owner_restart remote_style_mutations_keep_revivable_placements_after_owner_restart 2>&1 | tee restart-test.log
          grep -qE 'test result: ok\. [2-9][0-9]* passed' restart-test.log

      - name: Test Windows shortcut catalog
        run: dotnet run --project windows/CmuxGui.ShortcutTests/CmuxGui.ShortcutTests.csproj -c Release

      - name: Build native WinUI GUI
        run: dotnet build windows/CmuxGui/CmuxGui.csproj -c Debug -r win-x64
